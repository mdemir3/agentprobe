services:
  agentprobe:
    build: .
    container_name: agentprobe-core
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: uvicorn agentprobe.api.main:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    container_name: agentprobe-db
    environment:
      POSTGRES_USER: agentprobe
      POSTGRES_PASSWORD: agentprobe
      POSTGRES_DB: agentprobe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentprobe"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: agentprobe-chroma
    ports:
      - "8100:8000"
    volumes:
      - chromadata:/chroma/chroma

  dashboard:
    build: ./dashboard
    container_name: agentprobe-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - agentprobe
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata:
  chromadata:
