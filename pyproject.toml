[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentprobe"
version = "0.1.0"
description = "The first open-source AI agent that tests other AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Hikmet Demir", email = "hikmetdemir2424@gmail.com" },
]
keywords = ["ai", "agents", "testing", "llm", "mcp", "evaluation", "qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LLM access + HTTP
    "httpx>=0.27.0",
    # API + CLI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.8.0",
    # RAG-grounded evaluation
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=5.0.0",
    "scipy>=1.11.0",
    # Persistence (planned PostgreSQL backend; store is in-memory today)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
agentprobe = "agentprobe.cli:cli"

[project.urls]
Homepage = "https://github.com/mdemir3/agentprobe"
Repository = "https://github.com/mdemir3/agentprobe"
Issues = "https://github.com/mdemir3/agentprobe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentprobe"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042: we intentionally use `class X(str, Enum)` rather than `StrEnum` to keep
# stable `str()` representations across Python 3.11/3.12 for logging and prompts.
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
